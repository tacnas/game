<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画ビューア</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        input[type="file"]::-webkit-file-upload-button {
            cursor: pointer;
        }
        video::-webkit-media-controls-panel {
            display: none !important;
        }
        video::-webkit-media-controls {
            display: none !important;
        }
        video {
            -webkit-media-controls: none;
            -moz-media-controls: none;
            -o-media-controls: none;
            -ms-media-controls: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function VideoViewer() {
            const [videos, setVideos] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(70);
            const [size, setSize] = useState(100);
            const [isLoading, setIsLoading] = useState(false);
            const videoRef = useRef(null);
            const containerRef = useRef(null);

            const currentVideo = videos[currentIndex];

            // 数値でソート
            const naturalSort = (a, b) => {
                return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            };

            // フォルダ読み込み
            const handleFolderSelect = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setIsLoading(true);

                const videoFiles = files
                    .filter(file => file.type.startsWith('video/'))
                    .sort(naturalSort);

                const videoList = videoFiles.map((file, index) => ({
                    file,
                    name: file.name,
                    url: URL.createObjectURL(file),
                    index
                }));

                setVideos(videoList);
                setCurrentIndex(0);
                setIsLoading(false);
            };

            // 動画読み込み時
            useEffect(() => {
                if (videoRef.current && currentVideo) {
                    videoRef.current.load();
                    setCurrentTime(0);
                }
            }, [currentIndex, currentVideo]);

            // 音量設定
            useEffect(() => {
                if (videoRef.current) {
                    videoRef.current.volume = volume / 100;
                }
            }, [volume]);

            // 再生/一時停止
            const togglePlay = () => {
                if (videoRef.current) {
                    if (isPlaying) {
                        videoRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        videoRef.current.play();
                        setIsPlaying(true);
                    }
                }
            };

            // 動画を選択（再生中なら自動再生）
            const selectVideo = (index) => {
                const wasPlaying = isPlaying;
                setCurrentIndex(index);
                if (wasPlaying) {
                    setTimeout(() => {
                        if (videoRef.current) {
                            videoRef.current.play();
                            setIsPlaying(true);
                        }
                    }, 100);
                }
            };

            // 次の動画
            const goToNext = () => {
                if (currentIndex < videos.length - 1) {
                    selectVideo(currentIndex + 1);
                }
            };

            // 前の動画
            const goToPrev = () => {
                if (currentIndex > 0) {
                    selectVideo(currentIndex - 1);
                }
            };

            // 10秒スキップ
            const skip10Forward = () => {
                if (videoRef.current) {
                    videoRef.current.currentTime = Math.min(videoRef.current.currentTime + 10, duration);
                }
            };

            const skip10Backward = () => {
                if (videoRef.current) {
                    videoRef.current.currentTime = Math.max(videoRef.current.currentTime - 10, 0);
                }
            };

            // 30秒スキップ
            const skip30Forward = () => {
                if (videoRef.current) {
                    videoRef.current.currentTime = Math.min(videoRef.current.currentTime + 30, duration);
                }
            };

            const skip30Backward = () => {
                if (videoRef.current) {
                    videoRef.current.currentTime = Math.max(videoRef.current.currentTime - 30, 0);
                }
            };

            // サイズ変更
            const increaseSize = () => setSize(prev => Math.min(prev + 10, 200));
            const decreaseSize = () => setSize(prev => Math.max(prev - 10, 50));
            const resetSize = () => setSize(100);

            // 音量変更
            const increaseVolume = () => setVolume(prev => Math.min(prev + 5, 100));
            const decreaseVolume = () => setVolume(prev => Math.max(prev - 5, 0));

            // シークバー操作
            const handleSeek = (e) => {
                const seekTime = parseFloat(e.target.value);
                if (videoRef.current) {
                    videoRef.current.currentTime = seekTime;
                    setCurrentTime(seekTime);
                }
            };

            // 動画イベント
            const handleTimeUpdate = () => {
                if (videoRef.current) {
                    setCurrentTime(videoRef.current.currentTime);
                }
            };

            const handleLoadedMetadata = () => {
                if (videoRef.current) {
                    setDuration(videoRef.current.duration);
                }
            };

            const handleEnded = () => {
                setIsPlaying(false);
                // 自動的に次の動画へ
                if (currentIndex < videos.length - 1) {
                    setTimeout(() => {
                        goToNext();
                    }, 500);
                }
            };

            // 時間フォーマット
            const formatTime = (seconds) => {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            // キーボードショートカット
            useEffect(() => {
                const handleKeyPress = (e) => {
                    // 入力フォーカス中は無効化
                    if (e.target.tagName === 'INPUT') return;

                    if (e.key === ' ') {
                        e.preventDefault();
                        togglePlay();
                    }
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        goToNext();
                    }
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        goToPrev();
                    }
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        increaseVolume();
                    }
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        decreaseVolume();
                    }
                    if (e.key === '+' || e.key === '=') increaseSize();
                    if (e.key === '-' || e.key === '_') decreaseSize();
                    if (e.key === '0') resetSize();
                    
                    // スキップショートカット
                    if (e.key === '1') skip10Backward();
                    if (e.key === '3') skip10Forward();
                    if (e.key === '4') skip30Backward();
                    if (e.key === '6') skip30Forward();
                };

                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [isPlaying, currentIndex, videos.length, volume]);

            return (
                <div className="flex h-screen bg-gray-900 text-white overflow-hidden">
                    {/* サイドバー */}
                    <div className="w-72 bg-gray-800 p-4 flex flex-col gap-4 border-r border-gray-700 overflow-y-auto">
                        <div className="flex items-center gap-2 mb-4">
                            <svg className="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <h1 className="text-xl font-bold">動画ビューア</h1>
                        </div>

                        {/* フォルダ選択 */}
                        <div className="space-y-2">
                            <label className="block">
                                <span className="text-sm text-gray-400 mb-1 block">📁 フォルダを選択</span>
                                <input
                                    type="file"
                                    webkitdirectory=""
                                    directory=""
                                    onChange={handleFolderSelect}
                                    className="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer"
                                />
                            </label>
                        </div>

                        {/* 現在の動画情報 */}
                        {currentVideo && (
                            <div className="space-y-2 pb-2 border-b border-gray-700">
                                <h3 className="text-sm font-semibold text-gray-400">再生中</h3>
                                <div className="bg-gray-700 p-3 rounded">
                                    <p className="text-sm font-medium truncate" title={currentVideo.name}>
                                        {currentVideo.name}
                                    </p>
                                    <p className="text-xs text-gray-400 mt-1">
                                        {currentIndex + 1} / {videos.length}
                                    </p>
                                </div>

                                {/* 前/次ボタン */}
                                <div className="flex gap-2">
                                    <button
                                        onClick={goToPrev}
                                        disabled={currentIndex === 0}
                                        className={`flex-1 px-3 py-2 rounded font-medium flex items-center justify-center gap-1 ${
                                            currentIndex === 0
                                                ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                                : 'bg-gray-700 hover:bg-gray-600 text-white'
                                        }`}
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                                        </svg>
                                        前
                                    </button>
                                    <button
                                        onClick={goToNext}
                                        disabled={currentIndex === videos.length - 1}
                                        className={`flex-1 px-3 py-2 rounded font-medium flex items-center justify-center gap-1 ${
                                            currentIndex === videos.length - 1
                                                ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                                : 'bg-gray-700 hover:bg-gray-600 text-white'
                                        }`}
                                    >
                                        次
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 動画リスト */}
                        {videos.length > 0 && (
                            <div className="space-y-2 pb-2 border-b border-gray-700">
                                <h3 className="text-sm font-semibold text-gray-400">動画リスト</h3>
                                <div className="max-h-48 overflow-y-auto bg-gray-700 rounded p-2 space-y-1">
                                    {videos.map((video, index) => (
                                        <button
                                            key={index}
                                            onClick={() => selectVideo(index)}
                                            className={`w-full text-left px-3 py-2 rounded text-sm truncate ${
                                                index === currentIndex
                                                    ? 'bg-blue-600 text-white'
                                                    : 'bg-gray-600 hover:bg-gray-500 text-gray-200'
                                            }`}
                                            title={video.name}
                                        >
                                            {index + 1}. {video.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 再生コントロール */}
                        {currentVideo && (
                            <div className="space-y-3">
                                <h3 className="text-sm font-semibold text-gray-400">再生コントロール</h3>
                                
                                {/* 再生/一時停止 */}
                                <button
                                    onClick={togglePlay}
                                    className={`w-full px-4 py-3 rounded font-medium flex items-center justify-center gap-2 ${
                                        isPlaying ? 'bg-orange-600 hover:bg-orange-700' : 'bg-blue-600 hover:bg-blue-700'
                                    }`}
                                >
                                    {isPlaying ? (
                                        <>
                                            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                                            </svg>
                                            一時停止
                                        </>
                                    ) : (
                                        <>
                                            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M8 5v14l11-7z"/>
                                            </svg>
                                            再生
                                        </>
                                    )}
                                </button>

                                {/* 10秒スキップ */}
                                <div>
                                    <p className="text-xs text-gray-400 mb-2">10秒スキップ (1キー / 3キー)</p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={skip10Backward}
                                            className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded flex items-center justify-center gap-1"
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
                                            </svg>
                                            -10s
                                        </button>
                                        <button
                                            onClick={skip10Forward}
                                            className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded flex items-center justify-center gap-1"
                                        >
                                            +10s
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                {/* 30秒スキップ */}
                                <div>
                                    <p className="text-xs text-gray-400 mb-2">30秒スキップ (4キー / 6キー)</p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={skip30Backward}
                                            className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded flex items-center justify-center gap-1"
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
                                            </svg>
                                            -30s
                                        </button>
                                        <button
                                            onClick={skip30Forward}
                                            className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded flex items-center justify-center gap-1"
                                        >
                                            +30s
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 音量 */}
                        {currentVideo && (
                            <div className="space-y-2">
                                <h3 className="text-sm font-semibold text-gray-400">音量 ({volume}%) <span className="text-xs">↑↓キー</span></h3>
                                <input
                                    type="range"
                                    min="0"
                                    max="100"
                                    value={volume}
                                    onChange={(e) => setVolume(Number(e.target.value))}
                                    className="w-full"
                                />
                            </div>
                        )}

                        {/* サイズ */}
                        {currentVideo && (
                            <div className="space-y-2">
                                <h3 className="text-sm font-semibold text-gray-400">サイズ ({size}%)</h3>
                                <div className="flex gap-2">
                                    <button
                                        onClick={decreaseSize}
                                        className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded"
                                    >
                                        -
                                    </button>
                                    <button
                                        onClick={resetSize}
                                        className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded"
                                    >
                                        100%
                                    </button>
                                    <button
                                        onClick={increaseSize}
                                        className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ショートカット */}
                        <div className="text-xs text-gray-500 space-y-1 mt-auto">
                            <p className="font-semibold text-gray-400 mb-2">ショートカット</p>
                            <p>スペース : 再生/一時停止</p>
                            <p>← → : 前/次の動画</p>
                            <p>↑ ↓ : 音量変更</p>
                            <p>+ / - : サイズ変更</p>
                            <p>0 : サイズリセット</p>
                            <p>1 / 3 : 10秒戻し/進み</p>
                            <p>4 / 6 : 30秒戻し/進み</p>
                        </div>
                    </div>

                    {/* メインビューア */}
                    <div className="flex-1 flex flex-col bg-black">
                        {isLoading && (
                            <div className="flex-1 flex items-center justify-center">
                                <div className="text-center">
                                    <div className="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-500 mx-auto mb-4"></div>
                                    <p className="text-gray-400">読み込み中...</p>
                                </div>
                            </div>
                        )}

                        {!isLoading && videos.length === 0 && (
                            <div className="flex-1 flex items-center justify-center">
                                <div className="text-center text-gray-400">
                                    <svg className="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <p className="text-lg mb-2">動画ファイルを読み込んでください</p>
                                    <p className="text-sm">左のサイドバーからフォルダを選択</p>
                                </div>
                            </div>
                        )}

                        {currentVideo && (
                            <>
                                <div ref={containerRef} className="flex-1 flex items-center justify-center overflow-auto p-4">
                                    <video
                                        ref={videoRef}
                                        src={currentVideo.url}
                                        style={{ 
                                            width: `${size}%`,
                                            maxWidth: '100%',
                                            height: 'auto'
                                        }}
                                        onTimeUpdate={handleTimeUpdate}
                                        onLoadedMetadata={handleLoadedMetadata}
                                        onEnded={handleEnded}
                                    />
                                </div>

                                {/* シークバー */}
                                <div className="bg-gray-800 p-4 border-t border-gray-700">
                                    <div className="flex items-center gap-4">
                                        <span className="text-sm text-gray-400 min-w-[4rem]">
                                            {formatTime(currentTime)}
                                        </span>
                                        <input
                                            type="range"
                                            min="0"
                                            max={duration || 0}
                                            value={currentTime}
                                            onChange={handleSeek}
                                            className="flex-1"
                                            step="0.1"
                                        />
                                        <span className="text-sm text-gray-400 min-w-[4rem] text-right">
                                            {formatTime(duration)}
                                        </span>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<VideoViewer />, document.getElementById('root'));
    </script>
</body>
</html>
