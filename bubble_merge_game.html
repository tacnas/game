<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バブルマージゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            position: relative;
            text-align: center;
        }
        canvas {
            border: 4px solid #fff;
            background: #f0f8ff;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #fff;
            display: none;
        }
        #gameOver h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
        }
        #startMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #dangerLine {
            position: absolute;
            top: 120px;
            left: 4px;
            right: 4px;
            height: 2px;
            background: rgba(255, 0, 0, 0.5);
            border-top: 2px dashed #ff0000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div id="dangerLine"></div>
        <div id="ui">
            <div>スコア: <span id="score">0</span></div>
        </div>
        <div id="startMessage">クリックしてスタート</div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p style="font-size: 24px; margin: 20px 0;">スコア: <span id="finalScore">0</span></p>
            <p style="font-size: 18px; cursor: pointer; margin-top: 30px;" onclick="restartGame()">クリックしてリスタート</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ゲーム設定
        const GRAVITY = 0.05;
        const BOUNCE = 0.3;
        const FRICTION = 0.99;
        const DANGER_LINE = 100;
        
        // バブルサイズ設定（レベルごと）
        const BUBBLE_SIZES = [20, 30, 40, 50, 60, 70, 80];
        const BUBBLE_COLORS = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7DC6F', '#BB8FCE'
        ];
        
        // ゲーム状態
        let gameState = 'waiting'; // waiting, playing, gameOver
        let bubbles = [];
        let score = 0;
        let nextBubbleLevel = 0;
        let dropX = canvas.width / 2;
        
        // バブルクラス
        class Bubble {
            constructor(x, y, level) {
                this.x = x;
                this.y = y;
                this.level = level;
                this.radius = BUBBLE_SIZES[level];
                this.color = BUBBLE_COLORS[level];
                this.vx = 0;
                this.vy = 0;
                this.isStatic = false;
            }
            
            update() {
                if (this.isStatic) return;
                
                // 重力
                this.vy += GRAVITY;
                
                // 速度を位置に適用
                this.x += this.vx;
                this.y += this.vy;
                
                // 摩擦
                this.vx *= FRICTION;
                this.vy *= FRICTION;
                
                // 壁との衝突
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -BOUNCE;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -BOUNCE;
                }
                
                // 床との衝突
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -BOUNCE;
                    if (Math.abs(this.vy) < 0.5) {
                        this.vy = 0;
                        this.isStatic = true;
                    }
                }
            }
            
            draw() {
                // 影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(this.x, canvas.height - 5, this.radius * 0.8, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // バブル本体
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    this.radius * 0.1,
                    this.x,
                    this.y,
                    this.radius
                );
                gradient.addColorStop(0, this.lightenColor(this.color, 40));
                gradient.addColorStop(1, this.color);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 光沢
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // 輪郭
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            lightenColor(color, percent) {
                const num = parseInt(color.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = (num >> 16) + amt;
                const G = (num >> 8 & 0x00FF) + amt;
                const B = (num & 0x0000FF) + amt;
                return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                    (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                    (B < 255 ? B < 1 ? 0 : B : 255))
                    .toString(16).slice(1);
            }
        }
        
        // バブルの衝突判定
        function checkCollisions() {
            for (let i = 0; i < bubbles.length; i++) {
                for (let j = i + 1; j < bubbles.length; j++) {
                    const b1 = bubbles[i];
                    const b2 = bubbles[j];
                    
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = b1.radius + b2.radius;
                    
                    if (distance < minDist) {
                        // 同じレベルなら合体
                        if (b1.level === b2.level && b1.level < BUBBLE_SIZES.length - 1) {
                            mergeBubbles(i, j);
                            return;
                        }
                        
                        // 物理的な押し出し
                        const overlap = minDist - distance;
                        const angle = Math.atan2(dy, dx);
                        
                        const pushX = Math.cos(angle) * overlap * 0.5;
                        const pushY = Math.sin(angle) * overlap * 0.5;
                        
                        b1.x -= pushX;
                        b1.y -= pushY;
                        b2.x += pushX;
                        b2.y += pushY;
                        
                        // 速度の交換（簡易的な弾性衝突）
                        const vx1 = b1.vx;
                        const vy1 = b1.vy;
                        b1.vx = b2.vx * BOUNCE;
                        b1.vy = b2.vy * BOUNCE;
                        b2.vx = vx1 * BOUNCE;
                        b2.vy = vy1 * BOUNCE;
                    }
                }
            }
        }
        
        // バブルの合体
        function mergeBubbles(i, j) {
            const b1 = bubbles[i];
            const b2 = bubbles[j];
            
            // 中間点に新しいバブルを生成
            const newX = (b1.x + b2.x) / 2;
            const newY = (b1.y + b2.y) / 2;
            const newLevel = b1.level + 1;
            
            // 古いバブルを削除
            bubbles.splice(Math.max(i, j), 1);
            bubbles.splice(Math.min(i, j), 1);
            
            // 新しいバブルを追加
            const newBubble = new Bubble(newX, newY, newLevel);
            bubbles.push(newBubble);
            
            // スコア加算
            score += (newLevel + 1) * 10;
            
            // マージエフェクト
            createMergeEffect(newX, newY, newBubble.color);
        }
        
        // マージエフェクト
        function createMergeEffect(x, y, color) {
            // 簡易的なエフェクト（パーティクル）
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const particle = {
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 1.0,
                    color: color
                };
                // パーティクルは簡易実装のため省略
            }
        }
        
        // ゲームオーバーチェック
        function checkGameOver() {
            for (let bubble of bubbles) {
                if (bubble.y - bubble.radius < DANGER_LINE && bubble.isStatic) {
                    gameOver();
                    return;
                }
            }
        }
        
        // ゲームオーバー
        function gameOver() {
            gameState = 'gameOver';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // ゲーム更新
        function update() {
            if (gameState !== 'playing') return;
            
            // バブルの更新
            for (let bubble of bubbles) {
                bubble.update();
            }
            
            // 衝突判定
            checkCollisions();
            
            // ゲームオーバーチェック
            checkGameOver();
        }
        
        // 描画
        function draw() {
            // 背景
            ctx.fillStyle = '#f0f8ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 危険ライン
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, DANGER_LINE);
            ctx.lineTo(canvas.width, DANGER_LINE);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // バブルの描画
            for (let bubble of bubbles) {
                bubble.draw();
            }
            
            // 次に落とすバブルのプレビュー
            if (gameState === 'playing') {
                const previewBubble = new Bubble(dropX, 30, nextBubbleLevel);
                ctx.globalAlpha = 0.5;
                previewBubble.draw();
                ctx.globalAlpha = 1.0;
            }
            
            // UI更新
            document.getElementById('score').textContent = score;
        }
        
        // ゲーム開始
        function startGame() {
            gameState = 'playing';
            bubbles = [];
            score = 0;
            nextBubbleLevel = Math.floor(Math.random() * 3);
            
            document.getElementById('startMessage').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
        }
        
        // リスタート
        function restartGame() {
            startGame();
        }
        
        // マウスイベント
        canvas.addEventListener('mousemove', (e) => {
            if (gameState === 'playing') {
                const rect = canvas.getBoundingClientRect();
                dropX = e.clientX - rect.left;
                dropX = Math.max(BUBBLE_SIZES[nextBubbleLevel], Math.min(canvas.width - BUBBLE_SIZES[nextBubbleLevel], dropX));
            }
        });
        
        canvas.addEventListener('click', (e) => {
            if (gameState === 'waiting') {
                startGame();
            } else if (gameState === 'playing') {
                // バブルを落とす
                const newBubble = new Bubble(dropX, 30, nextBubbleLevel);
                bubbles.push(newBubble);
                
                // 次のバブルレベルを決定
                nextBubbleLevel = Math.floor(Math.random() * 3);
            }
        });
        
        // ゲームループ
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    </script>
</body>
</html>
