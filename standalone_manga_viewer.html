<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縦長スクロール型マンガビューア</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        input[type="file"]::-webkit-file-upload-button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function MangaViewer() {
            const [chapters, setChapters] = useState([]);
            const [currentChapterIndex, setCurrentChapterIndex] = useState(0);
            const [images, setImages] = useState([]);
            const [zoom, setZoom] = useState(100);
            const [isLoading, setIsLoading] = useState(false);
            const [autoScroll, setAutoScroll] = useState(false);
            const [scrollSpeed, setScrollSpeed] = useState(50);
            const [backgroundColor, setBackgroundColor] = useState('#1a1a1a');
            const [showChapterList, setShowChapterList] = useState(false);
            const scrollContainerRef = useRef(null);
            const autoScrollRef = useRef(null);

            // 現在の話を取得
            const currentChapter = chapters[currentChapterIndex];

            // 数値を抽出してソート用の比較関数
            const naturalSort = (a, b) => {
                return a.localeCompare(b, 'ja', { numeric: true, sensitivity: 'base' });
            };

            // 複数フォルダを読み込み
            const handleMultipleFoldersSelect = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                // フォルダごとにグループ化
                const folderMap = new Map();
                files.forEach(file => {
                    const pathParts = file.webkitRelativePath.split('/');
                    if (pathParts.length < 2) return;
                    
                    const folderName = pathParts[pathParts.length - 2]; // 直接の親フォルダ名
                    
                    if (!folderMap.has(folderName)) {
                        folderMap.set(folderName, []);
                    }
                    if (file.type.startsWith('image/')) {
                        folderMap.get(folderName).push(file);
                    }
                });

                // 各フォルダを話として登録（ファイルは数値順にソート）
                const newChapters = [];
                for (const [folderName, folderFiles] of folderMap.entries()) {
                    const sortedFiles = folderFiles.sort((a, b) => 
                        naturalSort(a.name, b.name)
                    );
                    newChapters.push({
                        name: folderName,
                        files: sortedFiles,
                        imageCount: sortedFiles.length
                    });
                }

                // フォルダ名を数値順にソート（第143話 < 第144話）
                newChapters.sort((a, b) => naturalSort(a.name, b.name));

                setChapters(newChapters);
                
                // 最初の話（最小の話数）を自動的に読み込む
                if (newChapters.length > 0) {
                    setCurrentChapterIndex(0);
                    await loadChapter(newChapters[0]);
                }
            };

            // 単一フォルダを読み込み
            const handleFolderSelect = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const imageFiles = files
                    .filter(file => file.type.startsWith('image/'))
                    .sort((a, b) => naturalSort(a.name, b.name));

                const folderName = files[0].webkitRelativePath?.split('/')[0] || '読み込み中の話';
                
                const chapter = {
                    name: folderName,
                    files: imageFiles,
                    imageCount: imageFiles.length
                };
                
                setChapters([chapter]);
                setCurrentChapterIndex(0);
                await loadChapter(chapter);
            };

            // 話を読み込む（必要になった時だけ画像を読み込む）
            const loadChapter = async (chapter) => {
                setIsLoading(true);
                //setAutoScroll(false);
                
                // この話の画像ファイルのみを読み込む
                const imageUrls = await Promise.all(
                    chapter.files.map(file => {
                        return new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                    })
                );

                setImages(imageUrls);
                setIsLoading(false);
                
                // スクロール位置をトップに戻す
                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = 0;
                }
            };

            // 次の話へ
            const goToNextChapter = () => {
                if (currentChapterIndex < chapters.length - 1) {
                    const nextIndex = currentChapterIndex + 1;
                    setCurrentChapterIndex(nextIndex);
                    loadChapter(chapters[nextIndex]);
                }
            };

            // 前の話へ
            const goToPrevChapter = () => {
                if (currentChapterIndex > 0) {
                    const prevIndex = currentChapterIndex - 1;
                    setCurrentChapterIndex(prevIndex);
                    loadChapter(chapters[prevIndex]);
                }
            };

            // 特定の話へジャンプ
            const jumpToChapter = (index) => {
                setCurrentChapterIndex(index);
                loadChapter(chapters[index]);
                setShowChapterList(false);
            };

            useEffect(() => {
                if (autoScroll && scrollContainerRef.current) {
                    autoScrollRef.current = setInterval(() => {
                        const container = scrollContainerRef.current;
                        const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
                        
                        // 最後まで到達したら次の話へ自動移動
                        if (isAtBottom && currentChapterIndex < chapters.length - 1) {
                            //setAutoScroll(false);
                            setTimeout(() => {
                                goToNextChapter();
                            }, 500);
                        } else {
                            container.scrollBy({
                                top: scrollSpeed / 10,
                                behavior: 'auto'
                            });
                        }
                    }, 50);
                } else {
                    if (autoScrollRef.current) {
                        clearInterval(autoScrollRef.current);
                    }
                }

                return () => {
                    if (autoScrollRef.current) {
                        clearInterval(autoScrollRef.current);
                    }
                };
            }, [autoScroll, scrollSpeed, currentChapterIndex, chapters.length]);

            const handleZoomIn = () => setZoom(prev => Math.min(prev + 10, 200));
            const handleZoomOut = () => setZoom(prev => Math.max(prev - 10, 50));
            const handleZoomReset = () => setZoom(100);

            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.key === '+' || e.key === '=') handleZoomIn();
                    if (e.key === '-' || e.key === '_') handleZoomOut();
                    if (e.key === '0') handleZoomReset();
                    if (e.key === ' ') {
                        e.preventDefault();
                        setAutoScroll(prev => !prev);
                    }
                    if (e.key === 'ArrowRight' && currentChapterIndex < chapters.length - 1) {
                        goToNextChapter();
                    }
                    if (e.key === 'ArrowLeft' && currentChapterIndex > 0) {
                        goToPrevChapter();
                    }
                };

                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [currentChapterIndex, chapters.length]);

            return (
                <div className="flex h-screen bg-gray-900 text-white overflow-hidden">
                    <div className="w-64 bg-gray-800 p-4 flex flex-col gap-4 border-r border-gray-700 overflow-y-auto">
                        <div className="flex items-center gap-2 mb-4">
                            <svg className="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                            <h1 className="text-xl font-bold">マンガビューア</h1>
                        </div>

                        <div className="space-y-2">
                            <label className="block">
                                <span className="text-sm text-gray-400 mb-1 block">📁 単一フォルダ</span>
                                <input
                                    type="file"
                                    webkitdirectory=""
                                    directory=""
                                    onChange={handleFolderSelect}
                                    className="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer"
                                />
                            </label>

                            <label className="block">
                                <span className="text-sm text-gray-400 mb-1 block">📚 複数フォルダ（親フォルダ選択）</span>
                                <input
                                    type="file"
                                    webkitdirectory=""
                                    directory=""
                                    onChange={handleMultipleFoldersSelect}
                                    className="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-green-600 file:text-white hover:file:bg-green-700 file:cursor-pointer"
                                />
                            </label>
                        </div>

                        {chapters.length > 0 && (
                            <div className="space-y-2 pb-2 border-b border-gray-700">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-sm font-semibold text-gray-400">現在の話</h3>
                                    <button
                                        onClick={() => setShowChapterList(!showChapterList)}
                                        className="text-xs text-blue-400 hover:text-blue-300"
                                    >
                                        {showChapterList ? '閉じる' : '一覧'}
                                    </button>
                                </div>
                                <div className="bg-gray-700 p-3 rounded">
                                    <p className="text-sm font-medium truncate" title={currentChapter?.name}>
                                        {currentChapter?.name}
                                    </p>
                                    <p className="text-xs text-gray-400 mt-1">
                                        {currentChapter?.imageCount}枚 • {currentChapterIndex + 1} / {chapters.length}
                                    </p>
                                </div>

                                {showChapterList && (
                                    <div className="max-h-64 overflow-y-auto bg-gray-700 rounded p-2 space-y-1">
                                        {chapters.map((chapter, index) => (
                                            <button
                                                key={index}
                                                onClick={() => jumpToChapter(index)}
                                                className={`w-full text-left px-3 py-2 rounded text-sm ${
                                                    index === currentChapterIndex
                                                        ? 'bg-blue-600 text-white'
                                                        : 'bg-gray-600 hover:bg-gray-500 text-gray-200'
                                                }`}
                                            >
                                                <div className="truncate" title={chapter.name}>
                                                    {chapter.name}
                                                </div>
                                                <div className="text-xs opacity-75">
                                                    {chapter.imageCount}枚
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                <div className="flex gap-2">
                                    <button
                                        onClick={goToPrevChapter}
                                        disabled={currentChapterIndex === 0}
                                        className={`flex-1 px-3 py-2 rounded font-medium flex items-center justify-center gap-1 ${
                                            currentChapterIndex === 0
                                                ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                                : 'bg-gray-700 hover:bg-gray-600 text-white'
                                        }`}
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                                        </svg>
                                        前
                                    </button>
                                    <button
                                        onClick={goToNextChapter}
                                        disabled={currentChapterIndex === chapters.length - 1}
                                        className={`flex-1 px-3 py-2 rounded font-medium flex items-center justify-center gap-1 ${
                                            currentChapterIndex === chapters.length - 1
                                                ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                                : 'bg-gray-700 hover:bg-gray-600 text-white'
                                        }`}
                                    >
                                        次
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="space-y-2">
                            <h3 className="text-sm font-semibold text-gray-400">ズーム ({zoom}%)</h3>
                            <div className="flex gap-2">
                                <button onClick={handleZoomOut} className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded">
                                    <svg className="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
                                    </svg>
                                </button>
                                <button onClick={handleZoomReset} className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded">
                                    <svg className="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                    </svg>
                                </button>
                                <button onClick={handleZoomIn} className="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded">
                                    <svg className="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div className="space-y-2">
                            <h3 className="text-sm font-semibold text-gray-400">自動スクロール</h3>
                            <button
                                onClick={() => setAutoScroll(!autoScroll)}
                                className={`w-full px-4 py-2 rounded font-medium ${
                                    autoScroll ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-700 hover:bg-gray-600'
                                }`}
                            >
                                {autoScroll ? '停止' : '開始'} (スペースキー)
                            </button>
                            {autoScroll && (
                                <div>
                                    <label className="text-sm text-gray-400 block mb-1">
                                        速度: {scrollSpeed}
                                    </label>
                                    <input
                                        type="range"
                                        min="10"
                                        max="100"
                                        value={scrollSpeed}
                                        onChange={(e) => setScrollSpeed(Number(e.target.value))}
                                        className="w-full"
                                    />
                                    <p className="text-xs text-gray-500 mt-1">
                                        ※最後まで到達すると自動的に次の話へ
                                    </p>
                                </div>
                            )}
                        </div>

                        <div className="space-y-2">
                            <h3 className="text-sm font-semibold text-gray-400">背景色</h3>
                            <div className="grid grid-cols-3 gap-2">
                                {['#1a1a1a', '#ffffff', '#2d2d2d', '#000000', '#f5f5f5', '#333333'].map(color => (
                                    <button
                                        key={color}
                                        onClick={() => setBackgroundColor(color)}
                                        className={`h-10 rounded border-2 ${
                                            backgroundColor === color ? 'border-blue-500' : 'border-gray-600'
                                        }`}
                                        style={{ backgroundColor: color }}
                                    />
                                ))}
                            </div>
                        </div>

                        {images.length > 0 && (
                            <div className="pt-4 border-t border-gray-700">
                                <p className="text-sm text-gray-400">
                                    表示中: {images.length}枚
                                </p>
                            </div>
                        )}

                        <div className="text-xs text-gray-500 space-y-1 mt-auto">
                            <p className="font-semibold text-gray-400 mb-2">ショートカット</p>
                            <p>+ / - : ズーム</p>
                            <p>0 : リセット</p>
                            <p>スペース : 自動スクロール</p>
                            <p>← → : 話の移動</p>
                        </div>
                    </div>

                    <div 
                        ref={scrollContainerRef}
                        className="flex-1 overflow-y-auto overflow-x-hidden"
                        style={{ backgroundColor }}
                    >
                        {isLoading && (
                            <div className="flex items-center justify-center h-full">
                                <div className="text-center">
                                    <div className="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-500 mx-auto mb-4"></div>
                                    <p className="text-gray-400">読み込み中...</p>
                                </div>
                            </div>
                        )}

                        {!isLoading && images.length === 0 && (
                            <div className="flex items-center justify-center h-full">
                                <div className="text-center text-gray-400">
                                    <svg className="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                    </svg>
                                    <p className="text-lg mb-2">マンガを読み込んでください</p>
                                    <p className="text-sm mb-4">複数の話を読むには「複数フォルダ」を選択</p>
                                    <p className="text-xs text-gray-500">例: 第143話、第144話が入った親フォルダを選択</p>
                                </div>
                            </div>
                        )}

                        {images.length > 0 && (
                            <div className="flex flex-col items-center py-8">
                                {images.map((src, index) => (
                                    <img
                                        key={index}
                                        src={src}
                                        alt={`ページ ${index + 1}`}
                                        style={{ width: `${zoom}%` }}
                                        className="block mb-1 max-w-full h-auto"
                                    />
                                ))}
                                {currentChapterIndex < chapters.length - 1 && (
                                    <div className="mt-8 mb-4">
                                        <button
                                            onClick={goToNextChapter}
                                            className="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium text-lg flex items-center gap-2"
                                        >
                                            次の話へ
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                            </svg>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MangaViewer />, document.getElementById('root'));
    </script>
</body>
</html>
